<!doctype html>
<!-- Etiqueta desplegada de la lata sandía (1024×512). Diseño simplificado propio. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;width:1024px;height:512px;overflow:hidden}</style></head>
<body>
<svg width="1024" height="512" viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FB45A"/><stop offset="1" stop-color="#1F7A35"/>
    </linearGradient>
    <pattern id="stripes" width="64" height="512" patternUnits="userSpaceOnUse" patternTransform="skewX(-12)">
      <path d="M10 0 C 30 120, 0 260, 22 512 L 40 512 C 18 260, 48 120, 28 0 Z" fill="#14532A" opacity=".55"/>
    </pattern>
    <g id="slice">
      <path d="M0 0 L 120 0 A 120 120 0 0 1 0 0 Z" fill="none"/>
      <path d="M -70 0 A 70 70 0 0 0 70 0 Z" fill="#E8457A"/>
      <path d="M -70 0 A 70 70 0 0 0 70 0" fill="none" stroke="#F4F1E6" stroke-width="8"/>
      <g fill="#141414"><ellipse cx="-30" cy="18" rx="4" ry="7"/><ellipse cx="0" cy="30" rx="4" ry="7"/><ellipse cx="30" cy="18" rx="4" ry="7"/></g>
    </g>
    <g id="face">
      <g transform="scale(1.25 1)">
        <text transform="translate(-24 474) rotate(-90)" font-family="Arial Black, Impact, sans-serif" font-size="112" fill="#FFFFFF" stroke="#141414" stroke-width="6" paint-order="stroke" letter-spacing="-4">FOUR</text>
        <text transform="translate(10 168) rotate(-90)" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="54" fill="#FFFFFF" stroke="#141414" stroke-width="4" paint-order="stroke">Loko</text>
        <text transform="translate(90 470) rotate(-90)" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="58" fill="#FFD7E6" stroke="#141414" stroke-width="3" paint-order="stroke">Sandía</text>
      </g>
    </g>
  </defs>
  <rect width="1024" height="512" fill="url(#green)"/>
  <rect width="1024" height="512" fill="url(#stripes)"/>
  <use href="#slice" transform="translate(400 380) rotate(-25)"/>
  <use href="#slice" transform="translate(420 140) rotate(20)"/>
  <use href="#slice" transform="translate(912 380) rotate(-25)"/>
  <use href="#slice" transform="translate(932 140) rotate(20)"/>
  <rect y="0" width="1024" height="42" fill="#141414"/>
  <rect y="494" width="1024" height="18" fill="#141414"/>
  <g font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#FF7FA8" letter-spacing="2">
    <text x="128" y="27" text-anchor="middle">12% ALC/VOL</text>
    <text x="640" y="28" text-anchor="middle">12% ALC/VOL</text>
    <text x="384" y="28" text-anchor="middle">TAMBOO NIGHTS</text>
    <text x="896" y="28" text-anchor="middle">TAMBOO NIGHTS</text>
  </g>
  <use href="#face" x="200"/>
  <use href="#face" x="712"/>
</svg>
</body></html>
