# Proxy de Tambo IA (It9). La API key NO va aquí: npx wrangler secret put GEMINI_API_KEY
name = "tambo-ia-proxy"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Orígenes permitidos para la versión web (coma separada). La app nativa no envía Origin.
ALLOWED_ORIGINS = "*"
